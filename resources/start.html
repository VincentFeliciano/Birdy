<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action https://www.google.com" />
    <title>New tab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c0f;
        --surface: #15171c;
        --elevated: #252931;
        --accent: #f5c400;
        --text: #e6e8eb;
        --muted: #8b9097;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      main { width: min(640px, 88vw); margin-top: -8vh; }
      body { background: radial-gradient(900px 400px at 50% 0%, rgba(245,196,0,.08), transparent 70%), var(--bg); }
      h1 { text-shadow: 0 0 18px rgba(245,196,0,.25); font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
      p { color: var(--muted); margin: 0 0 24px; }
      form { display: flex; gap: 8px; }
      input {
        flex: 1;
        height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid var(--elevated);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        outline: none;
      }
      select {
        height: 44px;
        padding: 0 10px;
        border-radius: 10px;
        border: 1px solid rgba(245,196,0,.35);
        background: var(--surface);
        color: var(--accent);
        font: 600 13px/1 inherit;
        font-family: inherit;
        outline: none;
        cursor: pointer;
      }
      select:focus { box-shadow: 0 0 6px rgba(245,196,0,.55); }
      input:focus { border-color: var(--accent); box-shadow: 0 0 6px rgba(245,196,0,.55), 0 0 20px rgba(245,196,0,.2); }
      button {
        height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #0b0c0f;
        box-shadow: 0 0 8px rgba(245,196,0,.6), 0 0 26px rgba(245,196,0,.25);
        font: 600 14px/1 inherit;
        font-family: inherit;
        cursor: pointer;
      }
      h2 {
        margin: 36px 0 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .grid a {
        display: block;
        padding: 14px;
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        text-decoration: none;
        border: 1px solid rgba(245,196,0,.14);
        transition: border-color .15s, box-shadow .15s;
      }
      .grid a:hover { border-color: rgba(245,196,0,.55); box-shadow: 0 0 6px rgba(245,196,0,.45), 0 0 18px rgba(245,196,0,.15); }
      .grid small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
      .hint { margin-top: 28px; font-size: 12px; color: var(--muted); }
      kbd {
        font: 11px ui-monospace, 'Cascadia Mono', Consolas, monospace;
        background: var(--surface);
        border: 1px solid var(--elevated);
        border-radius: 4px;
        padding: 1px 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Find something to print</h1>
      <p>Download an STL, 3MF, OBJ, GLB or PLY from any site and it opens in the workspace beside the page.</p>
      <form action="https://www.google.com/search" method="get">
        <select name="birdy_type" aria-label="What to search for">
          <option value="models" selected>3D models</option>
          <option value="stl">STL</option>
          <option value="3mf">3MF</option>
          <option value="obj">OBJ</option>
          <option value="glb">GLB / glTF</option>
          <option value="step">STEP (CAD)</option>
          <option value="assets">Assets</option>
          <option value="web">Web</option>
        </select>
        <input name="q" placeholder="Search Google for 3D models" autofocus autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <h2>Model sites</h2>
      <div class="grid">
        <a href="https://www.printables.com/">Printables<small>printables.com</small></a>
        <a href="https://www.thingiverse.com/">Thingiverse<small>thingiverse.com</small></a>
        <a href="https://makerworld.com/">MakerWorld<small>makerworld.com</small></a>
        <a href="https://thangs.com/">Thangs<small>thangs.com</small></a>
      </div>
      <div class="hint"><kbd>Ctrl</kbd> <kbd>E</kbd> toggles the workspace &nbsp;·&nbsp; <kbd>Ctrl</kbd> <kbd>O</kbd> opens a model from disk</div>
    </main>
  </body>
</html>
